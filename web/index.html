<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- viewport-fit=cover: the app draws edge to edge on a notched phone and keeps its own
         content clear with env(safe-area-inset-*) (canopy.css, the phone rules). -->
    <title>Canopy</title>
    <!-- The PNG is for browsers without SVG favicons (Safari); the SVG, listed last, wins
         everywhere else. Before JS runs it follows prefers-color-scheme; once the app paints,
         web/src/favicon.ts repoints it at the app's OWN resolved theme (green top bar = --green). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650;700&family=Archivo+Narrow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
