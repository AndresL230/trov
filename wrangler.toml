name = "trov"
account_id = "0bda3a2560ca48711ef7336cc421abed"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# Static Assets: served before the Worker fetch handler. Matched files (e.g. "/")
# are returned directly; unmatched paths (/ingest, /feed, /mcp) fall through to src/index.ts.
[assets]
directory = "./web/dist"
binding = "ASSETS"

# D1. For local dev and tests Miniflare uses a local sqlite; this id is the real remote DB.
[[d1_databases]]
binding = "DB"
database_name = "trov"
database_id = "6c71838c-18f7-4f68-8513-b58e86c237b9"

# R2: binary artifact bytes (image / pdf / file), content-addressed at
# `artifacts/<sha256>` (src/tools/artifacts.ts). Tests and `wrangler dev` get a
# local bucket from Miniflare. The bucket must exist before deploy, or the deploy fails.
[[r2_buckets]]
binding = "ARTIFACTS_BUCKET"
bucket_name = "trov-artifacts"

[vars]
# An organization's repository and environments are rows it edits in Org settings (`org_repos`,
# `org_environments`), not vars here.
# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are secrets, not vars. Set them via
# `wrangler secret put GOOGLE_CLIENT_ID` / `wrangler secret put GOOGLE_CLIENT_SECRET`.
# Absolute origin used for links inside email, artifact results and webhook URLs.
PUBLIC_ORIGIN = "https://trov.dev"
# The GitHub App's URL name — the last part of https://github.com/apps/<slug> — for the "Connect with
# GitHub" link (https://github.com/apps/<slug>/installations/new). Not a secret. EMPTY until the owner
# fills it in: while it is, Org settings offers only the pasted-token path and says the App is not
# configured on this deployment. GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY and GITHUB_APP_WEBHOOK_SECRET are
# secrets (`wrangler secret put …`) — see docs/architecture/github-app.md › Owner checklist.
GITHUB_APP_SLUG = "trov-by-trovlabs"
# Email delivery gate. "resend" = mail is really sent, from hello@trov.dev, with the RESEND_API_KEY
# secret (absent → every send is a configuration error, never a silent fallback). "local" writes the
# rendered bodies to a table and sends nothing. A deploy sets this from HERE: a value changed only in
# the Cloudflare dashboard is put back by the next deploy.
NOTIFICATIONS_MODE = "resend"

# Billing — Stripe (docs/architecture/billing.md › Owner checklist). The ids of the recurring PRICES the
# owner created in the Stripe dashboard (`price_…`), not amounts: Trov never holds a price, and the amount
# a buyer sees is Stripe's. Pro (plan id `team`) is the one plan sold, PER SEAT: STRIPE_PRICE_TEAM is the
# price of ONE seat (a licensed, per-unit recurring price) and a checkout's quantity is the seat count.
# EMPTY until the owner sets it — while it is empty Pro cannot be bought, and while STRIPE_SECRET_KEY /
# STRIPE_WEBHOOK_SECRET (secrets: `wrangler secret put …`) are unset every billing route answers 503
# `billing_unavailable` and the app is otherwise unchanged. The yearly id is optional.
STRIPE_PRICE_TEAM = ""
STRIPE_PRICE_TEAM_YEARLY = ""

[observability]
enabled = true

# ── Preview deployments (a build of any branch but main) ─────────────────────────────────────────────
# A Preview is the branch's code on its own URL, deployed by `npm run deploy:preview` (`wrangler preview`).
# It gets ONLY the bindings in this section — never production's: its own EMPTY database and bucket, so
# an unreviewed branch (and its migrations) can never read or change real data. It has no sign-in
# secrets, so nobody can sign in to a Preview; it shows the public pages and proves the branch builds,
# migrates from nothing and boots. Preview-only secrets: `wrangler preview secret put <NAME>`.
[previews.vars]
PUBLIC_ORIGIN = "https://trov.dev"
GITHUB_APP_SLUG = ""
NOTIFICATIONS_MODE = "local"
STRIPE_PRICE_TEAM = ""
STRIPE_PRICE_TEAM_YEARLY = ""

[[previews.d1_databases]]
binding = "DB"
database_name = "trov-preview"
database_id = "b8e88540-be00-4938-9f71-1eac4a8e7232"

[[previews.r2_buckets]]
binding = "ARTIFACTS_BUCKET"
bucket_name = "trov-preview-artifacts"

# Only so the preview database can be migrated by name: `wrangler d1 migrations apply trov-preview
# --remote --env preview`. Nothing is ever DEPLOYED to this environment.
[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "trov-preview"
database_id = "b8e88540-be00-4938-9f71-1eac4a8e7232"

# Capture-time PR/issue summaries come from Google Gemini over REST (GEMINI_API_KEY
# secret), a plain fetch(), not a Cloudflare binding, so no [ai] block is needed.

# Cron triggers, dispatched by expression in src/index.ts scheduled():
#   "*/10 * * * *"     repo dashboard: health pings every tick; hourly pollers at :00;
#                      every 6th hour: progress backstop :10, GitHub reconcile :20, capture prune :30.
#                      One heavy job per invocation (50-subrequest cap on the free plan).
#   "0 * * * *"        daily digest candidate (runs at notification_settings.send_hour, Mon to Fri)
#   "0 * * * SUN,MON"  weekly digest candidate (runs Monday at send_hour)
# The outbox idempotency key makes an extra fire harmless.
[triggers]
crons = ["*/10 * * * *", "0 * * * *", "0 * * * SUN,MON"]
