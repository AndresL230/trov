name = "trov"
account_id = "0bda3a2560ca48711ef7336cc421abed"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# Static Assets: served before the Worker fetch handler. Matched files (e.g. "/")
# are returned directly; unmatched paths (/ingest, /feed, /mcp) fall through to src/index.ts.
[assets]
directory = "./web/dist"
binding = "ASSETS"

# D1. For local dev and tests Miniflare uses a local sqlite; this id is the real remote DB.
[[d1_databases]]
binding = "DB"
database_name = "trov"
database_id = "6c71838c-18f7-4f68-8513-b58e86c237b9"

# R2: binary artifact bytes (image / pdf / file), content-addressed at
# `artifacts/<sha256>` (src/tools/artifacts.ts). Tests and `wrangler dev` get a
# local bucket from Miniflare. The bucket must exist before deploy, or the deploy fails.
[[r2_buckets]]
binding = "ARTIFACTS_BUCKET"
bucket_name = "trov-artifacts"

[vars]
# An organization's repository and environments are rows it edits in Org settings (`org_repos`,
# `org_environments`), not vars here.
# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are secrets, not vars. Set them via
# `wrangler secret put GOOGLE_CLIENT_ID` / `wrangler secret put GOOGLE_CLIENT_SECRET`.
# Absolute origin used for links inside email, artifact results and webhook URLs.
PUBLIC_ORIGIN = "https://trov.dev"
# Email delivery gate. "local" while this copy runs alongside Canopy, so the team
# never gets duplicate digests. Flip to "resend" at cutover (needs RESEND_API_KEY).
NOTIFICATIONS_MODE = "local"

# Billing — Stripe (docs/architecture/billing.md › Owner checklist). The ids of the recurring PRICES the
# owner created in the Stripe dashboard (`price_…`), not amounts: Trov never holds a price, and the amount
# a buyer sees is Stripe's. EMPTY until the owner decides prices — while a plan's id is empty that plan
# cannot be bought, and while STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET (secrets: `wrangler secret put …`)
# are unset every billing route answers 503 `billing_unavailable` and the app is otherwise unchanged.
# The yearly ids are optional: a plan is offered on the intervals it has a price for.
STRIPE_PRICE_PERSONAL = ""
STRIPE_PRICE_TEAM = ""
STRIPE_PRICE_PERSONAL_YEARLY = ""
STRIPE_PRICE_TEAM_YEARLY = ""

[observability]
enabled = true

# Capture-time PR/issue summaries come from Google Gemini over REST (GEMINI_API_KEY
# secret), a plain fetch(), not a Cloudflare binding, so no [ai] block is needed.

# Cron triggers, dispatched by expression in src/index.ts scheduled():
#   "*/10 * * * *"     repo dashboard: health pings every tick; hourly pollers at :00;
#                      every 6th hour: progress backstop :10, GitHub reconcile :20, capture prune :30.
#                      One heavy job per invocation (50-subrequest cap on the free plan).
#   "0 * * * *"        daily digest candidate (runs at notification_settings.send_hour, Mon to Fri)
#   "0 * * * SUN,MON"  weekly digest candidate (runs Monday at send_hour)
# The outbox idempotency key makes an extra fire harmless.
[triggers]
crons = ["*/10 * * * *", "0 * * * *", "0 * * * SUN,MON"]
