# trov-sandbox: Trov's private Daytona runner (docs/architecture/sandboxes.md). A SECOND Worker in this repo, deployed
# on its own — `pnpm run deploy:sandbox` — never by the main deploy. Trov reaches it only through its `SANDBOX` Service
# Binding (../../wrangler.toml), so it has no public URL.
name = "trov-sandbox"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# [vars]
# DAYTONA_API_URL = "https://app.daytona.io/api"

# Secret: DAYTONA_API_KEY (app.daytona.io › Keys) —
#   pnpm exec wrangler secret put DAYTONA_API_KEY -c workers/sandbox/wrangler.toml

[observability]
enabled = true
