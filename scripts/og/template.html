<!doctype html>
<!-- The Open Graph card for trov.dev's public pages: 1200 × 630, rendered by scripts/og/render.mjs.
     It is the site's brand banner (`.site-banner` in web/src/trov.css — the landing hero, the pricing
     page's top plan and the legal pages' title band): the same purple gradient, top-right highlight,
     dot field and faint tilted mark, in white type, at a size that still reads as a thumbnail. (The stops
     below are the banner's before 2026-10, when the site's went one step deeper for WCAG AA text contrast;
     the committed PNGs were rendered with these. To follow the site, change them and re-render.)
     render.mjs fills the four double-brace slots below (the vendored Geist file, the mark from shared/mark.ts, the copy, the URL);
     nothing else changes per page. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <style>
    /* Geist, the site's face: the SAME vendored file the site serves (web/src/fonts/geist-latin.woff2, SIL OFL 1.1),
       inlined by render.mjs as a data: URL, so rendering needs no network. Variable: one file, every weight. */
    @font-face { font-family: 'Geist'; font-style: normal; font-weight: 100 900; font-display: block;
      src: url({{geist}}) format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; background: #454fb2;
      font-family: 'Geist', system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }

    /* The banner: trov.css `.cnpy-orgs-banner, .site-banner` (light theme — the brand purple). Its two
       gradient layers are painted by the script below onto `.bg`, not by CSS: Chromium dithers CSS
       gradients, and that noise makes the PNG two to three times larger for no visible gain. */
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; display: flex; flex-direction: column;
      padding: 62px 84px 58px; background: #5a64cc; }
    .card > .bg { position: absolute; z-index: 0; inset: 0; display: block; }
    /* Its dot field, faded in from the left. The site's is 1px on 16px; a thumbnail is shown at
       ~40% scale, so the dots here are drawn twice as large to survive it. */
    .card::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
      background-image: radial-gradient(rgba(255,255,255,.22) 2px, transparent 2.4px); background-size: 28px 28px;
      -webkit-mask-image: linear-gradient(90deg, transparent 35%, #000 100%); mask-image: linear-gradient(90deg, transparent 35%, #000 100%); }
    .card > * { position: relative; z-index: 1; }
    /* `.site-banner-art`: the mark, white at 11%, tilted -8deg, running off the top-right corner. */
    .card > .art { position: absolute; z-index: 0; width: 560px; height: 560px; right: -96px; top: -118px;
      color: #fff; opacity: .11; transform: rotate(-8deg); }
    .art svg, .brand svg { display: block; width: 100%; height: 100%; }

    .brand { display: flex; align-items: center; gap: 14px; font-size: 36px; font-weight: 650; letter-spacing: -0.01em; line-height: 1; }
    .brand .mk { width: 40px; height: 40px; flex: none; color: #fff; }

    .main { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; max-width: 960px; }
    .eyebrow { margin: 0 0 18px; font-size: 21px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.78); }
    h1 { margin: 0; font-size: 70px; line-height: 1.06; font-weight: 650; letter-spacing: -0.032em; text-wrap: balance; }
    h1.long { font-size: 64px; }
    .lede { margin: 24px 0 0; max-width: 880px; font-size: 27px; line-height: 1.45; color: rgba(255,255,255,.88); text-wrap: pretty; }

    /* The legal pages' document tabs (`.site-legal-tabs`), the current one filled white. */
    .tabs { display: inline-flex; align-self: flex-start; gap: 3px; margin: 0 0 26px; padding: 4px; border-radius: 15px; background: rgba(255,255,255,.14); }
    .tab { padding: 9px 18px; border-radius: 11px; font-size: 21px; font-weight: 600; color: rgba(255,255,255,.82); }
    .tab.on { background: #fff; color: #333c8f; }

    /* The plans on offer, one chip each; the accented plan (the one the page accents) filled white. */
    .plans { display: flex; flex-wrap: wrap; gap: 14px; margin: 30px 0 0; }
    .plan { display: flex; align-items: baseline; gap: 12px; padding: 14px 22px; border-radius: 14px;
      border: 1.5px solid rgba(255,255,255,.38); background: rgba(255,255,255,.08); }
    .plan b { font-size: 27px; font-weight: 650; letter-spacing: -0.01em; }
    .plan span { font-size: 22px; color: rgba(255,255,255,.84); }
    .plan.on { border-color: #fff; background: #fff; color: #333c8f; }
    .plan.on span { color: #4a529e; }

    .url { font-size: 24px; font-weight: 500; letter-spacing: -0.005em; color: rgba(255,255,255,.9); }
  </style>
</head>
<body>
  <div class="card">
    <span class="art" aria-hidden="true"><svg viewBox="0 0 100 100"><path fill="currentColor" d="{{mark}}"/></svg></span>
    <div class="brand"><span class="mk"><svg viewBox="0 0 100 100"><path fill="currentColor" d="{{mark}}"/></svg></span>Trov</div>
    <div class="main">{{body}}</div>
    <div class="url">{{url}}</div>
  </div>
  <script>
    // The banner's background, undithered: linear-gradient(135deg, #6c75d8 0%, #5a64cc 48%, #454fb2 100%)
    // under radial-gradient(120% 140% at 100% 0%, rgba(255,255,255,.16) 0%, transparent 55%), as CSS
    // computes them (sRGB interpolation, the 135deg line's length = (W + H)·√½, the ellipse's radii = 120% × 140%).
    (() => {
      const card = document.querySelector(".card"), c = document.createElement("canvas");
      const W = (c.width = card.offsetWidth), H = (c.height = card.offsetHeight);
      c.className = "bg"; c.setAttribute("aria-hidden", "true"); card.prepend(c);
      const g = c.getContext("2d"), img = g.createImageData(W, H), px = img.data;
      const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
      const stops = [[0, hex("#6c75d8")], [0.48, hex("#5a64cc")], [1, hex("#454fb2")]];
      const s = Math.SQRT1_2, len = (W + H) * s, rx = 1.2 * W, ry = 1.4 * H;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const t = Math.min(1, Math.max(0, ((x - W / 2) * s + (y - H / 2) * s) / len + 0.5));
        const [t0, a] = stops[t < stops[1][0] ? 0 : 1], [t1, b] = stops[t < stops[1][0] ? 1 : 2], f = (t - t0) / (t1 - t0);
        const al = 0.16 * Math.max(0, 1 - Math.hypot((x - W) / rx, y / ry) / 0.55);
        const i = (y * W + x) * 4;
        for (let ch = 0; ch < 3; ch++) px[i + ch] = Math.round((a[ch] + (b[ch] - a[ch]) * f) * (1 - al) + 255 * al);
        px[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    })();
  </script>
</body>
</html>
