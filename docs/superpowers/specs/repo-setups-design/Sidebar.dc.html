<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside data-screen-label="Sidebar" style="width:228px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg);position:relative;align-self:stretch;height:100%;min-height:0;box-sizing:border-box">
  <div style="display:flex;align-items:center;padding:16px 14px 12px 17.5px;min-height:56px;box-sizing:border-box">
    <button type="button" aria-label="About Trov" style="display:flex;align-items:center;gap:10px;padding:0;color:inherit;border-radius:2.8px;background:none;border:none">
      <svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true" style="flex:none"><path fill="var(--mark)" d="M0 83.72H46.51V46.51H0ZM46.51 46.51H83.72V0H46.51ZM83.72 46.51V83.72H46.51V100H100V46.51Z"></path></svg>
      <span style="font-size:18px;font-weight:600;letter-spacing:-0.02em;white-space:nowrap;color:var(--fg)">Trov</span>
    </button>
  </div>
  <div style="flex:none;padding:0 10px 8px;position:relative;z-index:20">
    <button type="button" aria-haspopup="dialog" aria-expanded="{{ orgOpen }}" onClick="{{ toggleOrg }}" aria-label="{{ orgLabel }}" style="display:flex;align-items:center;gap:9px;width:100%;height:38px;box-sizing:border-box;padding:0 9px 0 6.5px;border:1px solid var(--border);background:var(--surface);color:var(--fg);text-align:left;overflow:hidden;border-radius:3.2px" style-hover="border-color:var(--border-strong)">
      <span aria-hidden="true" style="display:inline-grid;place-items:center;flex:none;box-sizing:border-box;width:24px;height:24px;font-size:12px;border-radius:2.8px;background:var(--hover);border:1px solid var(--border-strong);color:var(--fg-70);font-weight:600;line-height:1">{{ org.letter }}</span>
      <span style="flex:1;min-width:0;font-size:13px;font-weight:600;letter-spacing:-0.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ org.name }}</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;color:var(--fg-40)"><path d="m7 9 5-5 5 5"></path><path d="m7 15 5 5 5-5"></path></svg>
    </button>
    <sc-if value="{{ orgOpen }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ closeOrg }}" style="position:fixed;inset:0;z-index:1"></div>
      <div role="dialog" aria-label="Organizations" style="position:absolute;top:calc(100% - 2px);left:10px;z-index:2;width:268px;box-sizing:border-box;padding:5px;background:var(--surface);border:1px solid var(--border-strong);border-radius:4.4px;box-shadow:var(--menu-shadow)">
        <sc-for list="{{ orgRows }}" as="o" hint-placeholder-count="3">
          <button type="button" onClick="{{ o.pick }}" style="display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:6px 10px;border-radius:3.2px;text-align:left;font-size:13px;font-weight:500;color:var(--fg-70);background:{{ o.bg }};border:none" style-hover="background:var(--hover)">
            <span aria-hidden="true" style="display:inline-grid;place-items:center;flex:none;width:24px;height:24px;font-size:12px;border-radius:2.8px;background:var(--hover);border:1px solid var(--border-strong);color:var(--fg-70);font-weight:600">{{ o.letter }}</span>
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)">{{ o.name }}</span>
            <span style="font-size:11.5px;color:var(--fg-40)">Admin</span>
            <span style="width:14px;flex:none;display:grid;place-items:center"><sc-if value="{{ o.on }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
          </button>
        </sc-for>
        <div style="height:1px;background:var(--border);margin:5px 4px"></div>
        <button type="button" onClick="{{ goOrgSettings }}" style="display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:6px 10px;border-radius:3.2px;text-align:left;font-size:13px;font-weight:500;color:var(--fg-70);background:none;border:none" style-hover="background:var(--hover)">Org settings</button>
      </div>
    </sc-if>
  </div>
  <nav aria-label="Primary" style="display:flex;flex-direction:column;gap:3px;padding:0 10px 6px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none">
    <div style="flex:none;padding:6px 1px 4px">
      <div style="display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--border);border-radius:3.2px;color:var(--fg-40);overflow:hidden">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>
        <span style="flex:1;min-width:0;font-size:13px;color:var(--fg-40)">Search Trov</span>
        <kbd style="font-family:'Archivo Narrow',system-ui,sans-serif;font-size:10.5px;border:1px solid var(--border);border-radius:1.6px;padding:0 5px;color:var(--fg-40);flex:none;white-space:nowrap">⌘K</kbd>
      </div>
    </div>
    <div style="flex:none;height:31px;padding:10px 11px 0;box-sizing:border-box;font-family:'Archivo Narrow',system-ui,sans-serif;font-size:11.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-40);white-space:nowrap">Workspace</div>
    <sc-for list="{{ workspace }}" as="it" hint-placeholder-count="4">
      <div style="display:flex;align-items:center;flex:none;border-radius:3.2px;background:{{ it.bg }};box-shadow:{{ it.ring }}" style-hover="background:var(--hover)">
        <button type="button" onClick="{{ it.go }}" aria-label="{{ it.label }}" style="position:relative;display:flex;align-items:center;gap:11px;flex:1;min-width:0;padding:8px 41px 8px 11px;border-radius:3.2px;font-size:13.5px;font-weight:500;color:{{ it.color }};text-align:left;background:none;border:none">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="flex:none"><path d="{{ it.d }}"></path></svg>
          <span style="white-space:nowrap;flex:1;min-width:0">{{ it.label }}</span>
          <sc-if value="{{ it.n }}"><span style="font-family:'Archivo Narrow',system-ui,sans-serif;font-size:11px;font-weight:600;flex:none;min-width:18px;height:18px;line-height:18px;padding:0 6px;box-sizing:border-box;border-radius:4.5px;text-align:center;color:var(--fg-55);background:var(--hover);box-shadow:inset 0 0 0 1px var(--border)">{{ it.n }}</span></sc-if>
        </button>
      </div>
    </sc-for>
    <div style="flex:none;height:28px;padding:7px 11px 0;box-sizing:border-box;font-family:'Archivo Narrow',system-ui,sans-serif;font-size:11.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-40);white-space:nowrap">Monitor</div>
    <sc-for list="{{ monitor }}" as="it" hint-placeholder-count="2">
      <div style="display:flex;align-items:center;flex:none;border-radius:3.2px;background:{{ it.bg }};box-shadow:{{ it.ring }}" style-hover="background:var(--hover)">
        <button type="button" onClick="{{ it.go }}" aria-label="{{ it.label }}" aria-current="{{ it.current }}" style="position:relative;display:flex;align-items:center;gap:11px;flex:1;min-width:0;padding:8px 41px 8px 11px;border-radius:3.2px;font-size:13.5px;font-weight:500;color:{{ it.color }};text-align:left;background:none;border:none">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="flex:none"><path d="{{ it.d }}"></path></svg>
          <span style="white-space:nowrap;flex:1;min-width:0">{{ it.label }}</span>
        </button>
      </div>
    </sc-for>
    <div style="flex:none;height:28px;padding:7px 11px 0;box-sizing:border-box;font-family:'Archivo Narrow',system-ui,sans-serif;font-size:11.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-40);white-space:nowrap">Knowledge</div>
    <sc-for list="{{ knowledge }}" as="it" hint-placeholder-count="3">
      <div style="display:flex;align-items:center;flex:none;border-radius:3.2px" style-hover="background:var(--hover)">
        <button type="button" onClick="{{ it.go }}" aria-label="{{ it.label }}" style="position:relative;display:flex;align-items:center;gap:11px;flex:1;min-width:0;padding:8px {{ it.pr }} 8px 11px;border-radius:3.2px;font-size:13.5px;font-weight:500;color:var(--fg-55);text-align:left;background:none;border:none">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="flex:none"><path d="{{ it.d }}"></path></svg>
          <span style="white-space:nowrap;flex:1;min-width:0">{{ it.label }}</span>
        </button>
        <sc-if value="{{ it.chev }}"><span aria-hidden="true" style="flex:none;width:24px;height:30px;margin-right:6px;display:grid;place-items:center;color:var(--fg-40);opacity:.8"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"></path></svg></span></sc-if>
      </div>
    </sc-for>
    <div style="flex:none;height:28px;padding:7px 11px 0;box-sizing:border-box;font-family:'Archivo Narrow',system-ui,sans-serif;font-size:11.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-40);white-space:nowrap">Triage</div>
    <sc-for list="{{ triage }}" as="it" hint-placeholder-count="2">
      <div style="display:flex;align-items:center;flex:none;border-radius:3.2px" style-hover="background:var(--hover)">
        <button type="button" onClick="{{ it.go }}" aria-label="{{ it.label }}" style="position:relative;display:flex;align-items:center;gap:11px;flex:1;min-width:0;padding:8px 41px 8px 11px;border-radius:3.2px;font-size:13.5px;font-weight:500;color:var(--fg-55);text-align:left;background:none;border:none">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="flex:none"><path d="{{ it.d }}"></path></svg>
          <span style="white-space:nowrap;flex:1;min-width:0">{{ it.label }}</span>
          <sc-if value="{{ it.n }}"><span style="font-family:'Archivo Narrow',system-ui,sans-serif;font-size:11px;font-weight:600;flex:none;min-width:18px;height:18px;line-height:18px;padding:0 6px;box-sizing:border-box;border-radius:4.5px;text-align:center;color:var(--fg-55);background:var(--hover);box-shadow:inset 0 0 0 1px var(--border)">{{ it.n }}</span></sc-if>
        </button>
      </div>
    </sc-for>
    <div style="flex:none;height:28px;padding:7px 11px 0;box-sizing:border-box;font-family:'Archivo Narrow',system-ui,sans-serif;font-size:11.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-40);white-space:nowrap">Help</div>
    <sc-for list="{{ help }}" as="it" hint-placeholder-count="2">
      <div style="display:flex;align-items:center;flex:none;border-radius:3.2px" style-hover="background:var(--hover)">
        <button type="button" onClick="{{ it.go }}" aria-label="{{ it.label }}" style="position:relative;display:flex;align-items:center;gap:11px;flex:1;min-width:0;padding:8px 41px 8px 11px;border-radius:3.2px;font-size:13.5px;font-weight:500;color:var(--fg-55);text-align:left;background:none;border:none">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="flex:none"><path d="{{ it.d }}"></path></svg>
          <span style="white-space:nowrap;flex:1;min-width:0">{{ it.label }}</span>
        </button>
      </div>
    </sc-for>
  </nav>
  <div style="padding:0 10px 6px;flex:none">
    <button type="button" aria-label="Collapse sidebar" style="display:flex;align-items:center;gap:11px;width:100%;padding:8px 11px;border-radius:2.8px;font-size:12.5px;font-weight:500;color:var(--fg-40);text-align:left;background:none;border:none" style-hover="color:var(--fg-70);background:var(--hover)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="flex:none"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path><path d="M14.5 9.5 12 12l2.5 2.5"></path></svg>
      <span>Collapse</span>
    </button>
  </div>
  <div style="padding:0 21px 9px;font-size:11.5px;color:var(--fg-40);white-space:nowrap;overflow:hidden;flex:none">agents produce · humans confirm</div>
  <div style="padding:10px;border-top:1px solid var(--border);flex:none">
    <button type="button" aria-label="Settings" style="display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:3.6px;text-align:left;overflow:hidden;background:none;border:none;color:var(--fg)">
      <div title="{{ me.name }}" style="width:28px;height:28px;border-radius:25%;background:var(--p-{{ me.color }});display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--p-ink);flex:none">{{ me.initials }}</div>
      <div style="overflow:hidden;flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ me.name }}</div>
        <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;font-size:11px;font-weight:500;color:var(--p-{{ me.color }})">@{{ me.handle }}</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" style="flex:none;color:var(--fg-40)"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:228,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;repo&quot;,&quot;feed&quot;,&quot;mywork&quot;],&quot;default&quot;:&quot;repo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;org&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{name:string,letter:string}&quot;},&quot;me&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  state = { orgOpen: false };
  renderVals() {
    const active = this.props.active || 'repo';
    const org = this.props.org || { name: 'SaplingLearn', letter: 'S' };
    const me = this.props.me || { handle: 'andres', name: 'Andres Lopez', color: 'moss', initials: 'AL' };
    const D = {
      mywork: 'M3 12 12 3l9 9M5 10v10h14V10M9 20v-6h6v6',
      tickets: 'M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2zM13 5v2M13 11v2M13 17v2',
      roadmap: 'M5 21V4M5 4.5C7 3 9 3 12 4.5s5 1.5 7 0V13c-2 1.5-4 1.5-7 0s-5-1.5-7 0',
      handoffs: 'M22 2 11 13M22 2 15 22l-4-9-9-4z',
      repo: 'M6 3v12M18 3a3 3 0 1 1 0 6a3 3 0 1 1 0-6M6 15a3 3 0 1 1 0 6a3 3 0 1 1 0-6M18 9a9 9 0 0 1-9 9',
      feed: 'M4 5h16M4 12h16M4 19h10',
      docs: 'M6 3h7l5 5v13H6zM13 3v5h5M9 13h6M9 17h6',
      artifacts: 'M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM3 9h18M7 13.5h6M7 16.5h9',
      prompts: 'M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1',
      review: 'M7 4h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3zm2 8.5 2 2 4-5',
      unplaced: 'M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z',
      guide: 'M2 4h7a3 3 0 0 1 3 3v14a2.5 2.5 0 0 0-2.5-2.5H2zM22 4h-7a3 3 0 0 0-3 3v14a2.5 2.5 0 0 1 2.5-2.5H22z',
      releases: 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z',
    };
    const row = (key, label, n) => {
      const on = key === active;
      return { key, label, n: n || 0, d: D[key], bg: on ? 'var(--nav-on-bg)' : 'transparent', ring: on ? 'var(--nav-on-ring)' : 'none', color: on ? 'var(--fg)' : 'var(--fg-55)', current: on ? 'page' : undefined };
    };
    const nav = (label) => () => { if (this.props.onNav) this.props.onNav(label); };
    const orgs = this.props.orgs || [{ key: 'x', name: org.name, letter: org.letter, on: true }];
    const withGo = (list) => list.map((x) => ({ ...x, go: nav(x.label) }));
    return {
      orgOpen: this.state.orgOpen, toggleOrg: () => this.setState({ orgOpen: !this.state.orgOpen }), closeOrg: () => this.setState({ orgOpen: false }),
      orgRows: orgs.map((o) => ({ ...o, bg: o.on ? 'var(--hover)' : 'transparent', pick: () => { this.setState({ orgOpen: false }); if (this.props.onOrg) this.props.onOrg(o.key); } })),
      goOrgSettings: () => { this.setState({ orgOpen: false }); if (this.props.onNav) this.props.onNav('Org settings'); },
      org, me, orgLabel: `${org.name}: switch organization`,
      workspace: withGo([row('mywork', 'My Work'), row('tickets', 'Tickets', 4), row('roadmap', 'Roadmap'), row('handoffs', 'Handoffs', 1)]),
      monitor: withGo([row('repo', 'Repo'), row('feed', 'Feed')]),
      knowledge: withGo([{ label: 'Docs', d: D.docs, chev: true, pr: '11px' }, { label: 'Artifacts', d: D.artifacts, pr: '41px' }, { label: 'Prompt Library', d: D.prompts, pr: '41px' }]),
      triage: withGo([{ label: 'Review', d: D.review, n: 2 }, { label: 'Unplaced', d: D.unplaced, n: 0 }]),
      help: withGo([{ label: 'Guide', d: D.guide }, { label: "What's new", d: D.releases }]),
    };
  }
}
</script>
</body>
</html>
