<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:20px 22px 12px;min-width:0;box-sizing:border-box">
  <div style="display:flex;align-items:center;gap:6px 10px;margin-bottom:12px;flex-wrap:wrap">
    <span style="font-size:16.5px;font-weight:600;letter-spacing:-0.01em">{{ env.name }}</span>
    <span style="font-size:12px;color:var(--fg-40);white-space:nowrap">from <span style="font-family:var(--code);font-size:11.5px;color:var(--fg-55)">{{ env.branch }}</span></span>
    <span style="margin-left:auto"><dc-import name="Mark" m="{{ env.verdict }}" hint-size="80px,16px"></dc-import></span>
  </div>
  <sc-for list="{{ env.rows }}" as="r" hint-placeholder-count="2">
    <div style="display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:4px 12px;padding:11px 0;border-top:1px solid var(--border);align-items:start">
      <span style="font-size:13px;font-weight:600;color:var(--fg);line-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ r.app }}</span>
      <div style="min-width:0;display:flex;flex-direction:column;gap:5px">
        <div style="display:flex;align-items:center;gap:6px 9px;flex-wrap:wrap;min-height:22px">
          <sc-if value="{{ r.sha }}"><span style="font-family:var(--label);font-size:12.5px;color:var(--fg);background:var(--hover);border:1px solid var(--border);border-radius:1.6px;padding:0 5px;line-height:18px">{{ r.sha }}</span></sc-if>
          <span style="font-size:12px;color:var(--fg-55);white-space:nowrap">{{ r.meta }}</span>
          <sc-if value="{{ r.state }}" hint-placeholder-val="{{ false }}"><dc-import name="Mark" m="{{ r.state }}" size="12" hint-size="70px,16px"></dc-import></sc-if>
        </div>
        <sc-if value="{{ r.line }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:flex-start;gap:7px;font-size:12.5px;line-height:1.5;color:var(--fg-70)"><sc-if value="{{ r.line.m }}"><span style="padding-top:4px;flex:none"><dc-import name="Mark" m="{{ r.line.m }}" size="12" hint-size="9px,9px"></dc-import></span></sc-if><span>{{ r.line.text }}</span></div>
        </sc-if>
        <sc-if value="{{ r.flag }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg-70)"><dc-import name="Mark" m="{{ r.flag.m }}" size="12" hint-size="9px,9px"></dc-import><span style="white-space:nowrap">{{ r.flag.text }}</span></div>
        </sc-if>
        <sc-if value="{{ r.url }}" hint-placeholder-val="{{ true }}">
          <a href="{{ r.href }}" target="_blank" rel="noopener" style="font-size:12.5px;color:var(--accent);text-decoration:none;align-self:flex-start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%" style-hover="text-decoration:underline;text-underline-offset:3px">{{ r.url }} ↗</a>
        </sc-if>
      </div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:12px;color:var(--fg-55);line-height:22px;white-space:nowrap;font-variant-numeric:tabular-nums">
        <span>{{ r.health }}</span>
        <sc-if value="{{ r.healthMark }}" hint-placeholder-val="{{ false }}"><dc-import name="Mark" m="{{ r.healthMark }}" size="12" hint-size="60px,16px"></dc-import></sc-if>
      </div>
    </div>
  </sc-for>
  <sc-if value="{{ env.ci }}" hint-placeholder-val="{{ true }}">
    <div style="display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:11px 0 6px;border-top:1px solid var(--border);align-items:baseline">
      <span style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-40);white-space:nowrap">CI on head</span>
      <span style="font-size:12.5px;line-height:1.5;color:{{ env.ci.tone }};display:flex;gap:7px;align-items:center;min-width:0"><span style="font-size:12.5px;font-weight:600;flex:none">{{ env.ci.glyph }}</span><sc-if value="{{ env.ci.dot }}"><span aria-hidden="true" style="display:inline-block;width:7px;height:7px;border-radius:25%;background:currentColor;flex:none"></span></sc-if><span>{{ env.ci.text }}</span></span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:320},&quot;env&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;EnvCardModel&quot;}}"></script>
</body>
</html>
