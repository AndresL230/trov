<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border-top:1px solid var(--border)">
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:13px 20px;border-bottom:1px solid var(--border)">
    <span style="font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-40);white-space:nowrap">Previews · {{ pv.count }} open</span>
    <span style="font-size:11px;color:var(--fg-40);white-space:nowrap">one per open pull request</span>
  </div>
  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="padding:14px 20px;font-size:12.5px;color:var(--fg-55)">No open pull requests, so no previews.</div></sc-if>
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
    <div style="display:flex;align-items:center;gap:12px;padding:9px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap" style-hover="background:var(--hover)">
      <div title="{{ r.who.name }}" style="width:22px;height:22px;border-radius:25%;background:var(--p-{{ r.who.color }});display:grid;place-items:center;font-size:9px;font-weight:600;color:var(--p-ink);flex:none">{{ r.who.initials }}</div>
      <div style="min-width:0;flex:1 1 260px;display:flex;flex-direction:column;gap:2px">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500">{{ r.title }} <span style="font-size:11px;font-weight:400;color:var(--fg-40)">#{{ r.pr }} · {{ r.branch }}</span></span>
        <sc-if value="{{ r.since }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:var(--fg-55)">{{ r.since }}</span></sc-if>
      </div>
      <sc-if value="{{ r.m }}" hint-placeholder-val="{{ false }}"><span style="flex:none"><dc-import name="Mark" m="{{ r.m }}" size="12" hint-size="70px,16px"></dc-import></span></sc-if>
      <span style="flex:0 1 auto;min-width:0;max-width:300px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        <sc-if value="{{ r.link }}" hint-placeholder-val="{{ true }}"><a href="#" style="font-size:12.5px;color:var(--accent);text-decoration:none" style-hover="text-decoration:underline;text-underline-offset:3px">{{ r.link }} ↗</a></sc-if>
        <sc-if value="{{ r.logs }}" hint-placeholder-val="{{ false }}"><a href="#" style="font-size:12.5px;color:var(--accent);text-decoration:none" style-hover="text-decoration:underline;text-underline-offset:3px">Build log ↗</a></sc-if>
      </span>
      <span style="width:34px;text-align:right;flex:none;font-size:11.5px;color:var(--fg-40)">{{ r.age }}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:260},&quot;pv&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;PreviewsModel&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const pv = this.props.pv || { count: 0, rows: [] };
    return { pv, empty: !pv.rows.length, rows: pv.rows.map((r) => ({ ...r, logs: r.state === 'failed' })) };
  }
}
</script>
</body>
</html>
