<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:14px 22px 6px;background:color-mix(in srgb,var(--accent) 4%,var(--surface));border-bottom:1px solid var(--border)">
  <div style="display:flex;align-items:baseline;gap:8px">
    <span style="font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-40);white-space:nowrap">Needs attention</span>
    <span style="font-size:11.5px;color:var(--fg-40)">{{ count }}</span>
  </div>
  <sc-for list="{{ rows }}" as="a" hint-placeholder-count="1">
    <div style="display:flex;align-items:center;gap:8px 12px;padding:10px 0;border-top:{{ a.top }};flex-wrap:wrap">
      <div style="display:flex;align-items:flex-start;gap:12px;flex:1 1 300px;min-width:0">
        <span style="flex:none;display:flex;width:12px;justify-content:center;padding-top:5px"><dc-import name="Mark" m="{{ a.m }}" size="14" hint-size="10px,10px"></dc-import></span>
        <span style="flex:1;min-width:0;font-size:13.5px;line-height:1.5;color:var(--fg);text-wrap:pretty">{{ a.text }}</span>
      </div>
      <button type="button" style="height:30px;padding:0 12px;border-radius:3.2px;font-size:12.5px;font-weight:500;border:1px solid var(--border-strong);color:var(--fg-70);background:var(--surface);white-space:nowrap;flex:none" style-hover="background:var(--hover);color:var(--fg)">{{ a.action }}</button>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:160},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{m,text,action}&gt;&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const items = this.props.items || [];
    return { rows: items.map((a, i) => ({ ...a, top: i ? '1px solid var(--border)' : '0' })), count: items.length > 1 ? String(items.length) : '' };
  }
}
</script>
</body>
</html>
