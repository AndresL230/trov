<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:18px 20px 8px;min-width:0;box-sizing:border-box;height:100%;display:flex;flex-direction:column">
  <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:10px">
    <span style="font-size:15px;font-weight:600">{{ u.title }}</span>
    <span style="font-size:12.5px;color:var(--fg-55)">{{ u.env }}</span>
    <span style="margin-left:auto;font-size:11px;color:var(--fg-40);white-space:nowrap">{{ u.source }}</span>
  </div>
  <sc-if value="{{ u.ok }}" hint-placeholder-val="{{ true }}">
    <sc-for list="{{ u.metrics }}" as="m" hint-placeholder-count="2">
      <div style="border-top:1px solid var(--border);padding:12px 0">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px"><span style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-40)">{{ m.label }}</span><span style="display:flex;align-items:baseline;gap:6px"><span style="font-size:17px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;color:{{ m.color }}">{{ m.value }}</span><span style="font-size:11px;color:var(--fg-40)">{{ m.of }}</span></span></div>
        <svg viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true" style="width:100%;height:40px;display:block;margin-top:8px"><polyline points="{{ m.pts }}" fill="none" stroke="{{ m.stroke }}" stroke-width="1.6" vector-effect="non-scaling-stroke"></polyline></svg>
      </div>
    </sc-for>
  </sc-if>
  <sc-if value="{{ u.stale }}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{ u.metrics }}" as="m" hint-placeholder-count="2">
      <div style="border-top:1px solid var(--border);padding:12px 0">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-40)">{{ m.label }}</span><span style="display:flex;align-items:center;gap:8px"><dc-import name="Mark" m="{{ staleMark }}" size="11.5" hint-size="110px,14px"></dc-import><span style="font-size:11.5px;color:var(--fg-40)">· {{ m.staleText }}</span></span></div>
        <svg viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true" style="width:100%;height:40px;display:block;margin-top:8px"><polyline points="{{ m.pts }}" fill="none" stroke="var(--fg-40)" stroke-width="1.4" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" opacity=".7"></polyline></svg>
      </div>
    </sc-for>
    <div style="font-size:12px;line-height:1.5;color:var(--fg-55);padding:2px 0 8px">{{ u.staleNote }}</div>
  </sc-if>
  <sc-if value="{{ u.nc }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:flex;align-items:center;padding:6px 0 12px">
      <div style="border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);border-radius:4.4px;padding:18px 20px;text-align:center;width:100%;box-sizing:border-box;background:color-mix(in srgb,var(--accent) 4%,transparent)">
        <div style="font-size:13.5px;font-weight:600">Not connected</div>
        <div style="font-size:12.5px;color:var(--fg-55);margin-top:4px;line-height:1.55">{{ u.ncText }}</div>
        <button type="button" style="margin-top:12px;height:30px;padding:0 13px;border-radius:3.2px;background:var(--accent);color:var(--accent-fg);border:1px solid transparent;font-size:12.5px;font-weight:600;white-space:nowrap" style-hover="filter:brightness(1.06)">{{ u.ncAction }}</button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ u.na }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid var(--border);padding:14px 0 12px;flex:1">
      <div style="font-size:13px;line-height:1.55;color:var(--fg-70)">{{ u.naText }}</div>
      <div style="font-size:12px;line-height:1.5;color:var(--fg-55);margin-top:4px">{{ u.naSub }}</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:280},&quot;u&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;UsageItem&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const u = this.props.u || { metrics: [] };
    return { u, staleMark: { shape: 'ring', tone: 'var(--fg-55)', word: 'No recent reading' } };
  }
}
</script>
</body>
</html>
